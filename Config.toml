[client_config]
discord_bot_token = "{{REQUESTX_DISCORD_BOT_TOKEN}}"
discord_app_id = "{{REQUESTX_DISCORD_APP_ID}}"
discord_guild_id = "{{REQUESTX_DISCORD_GUILD_ID}}"
discord_reviewer_role_id = "{{REQUESTX_DISCORD_REVIEWER_ROLE_ID}}"
discord_maintenance_role_id = "{{REQUESTX_DISCORD_MAINTENANCE_ROLE_ID}}"
discord_bot_admin_id = "{{REQUESTX_DISCORD_BOT_ADMIN_ID}}"
discord_log_channel_id = "{{REQUESTX_DISCORD_LOG_CHANNEL_ID}}"
discord_requests_channel_id = "{{REQUESTX_DISCORD_REQUESTS_CHANNEL_ID}}"
discord_public_channel_id = "{{REQUESTX_DISCORD_PUBLIC_CHANNEL_ID}}"
discord_verify_channel_id = "{{REQUESTX_DISCORD_VERIFY_CHANNEL_ID}}"

[requestx_api_config]
base_url = "{{REQUESTX_BASE_URL}}"

[requestx_api_config.paths]
get_user = "/api/v1/user"
request_level = "/api/v1/request_level"
review_level = "/api/v1/review_level"
reviewer = "/api/v1/reviewer"
auth = "/api/v1/auth"
send_level = "/api/v1/internal/send_level"
update_request_message_id = "/api/v1/internal/request_level"
update_review_message_id = "/api/v1/internal/review_level"
update_request_thread_id = "/api/v1/internal/request_level/thread"
update_request_manager = "/api/v1/internal/request_config"

[requestx_api_config.headers]
requestx_discord_app_id = "X-REQUESTX-DISCORD-APP-ID"

[auth_config]
auth_header_name = "X-REQUESTX-ACCESS-TOKEN"
access_token = "{{REQUESTX_ACCESS_TOKEN}}"
secret_token = "{{REQUESTX_SECRET_TOKEN}}"
token_buffer = 5
