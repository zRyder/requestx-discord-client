[package]
name = "requestx-discord-client"
version = "1.2.3"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serenity = {git = "https://github.com/zRyder/serenity.git", branch = "label-component", features = ["builder"]}
tokio = { version = "1.48.0", features = ["rt-multi-thread"] }
async-once-cell = "0.5.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
lazy_static = "1.5.0"
reqwest = { version = "0.12.24", features = ["json"] }
chrono = "0.4.42"
config = "0.15.19"
url = "2.5.7"
async-trait = "0.1.89"
jsonwebtoken = { version = "10.2.0", features = ["rust_crypto"] }
log4rs = {version = "1.3.1", features = ["json_encoder", "json_format", "serde_json", "default"]}
handlebars = "6.3.2"
log = { version = "0.4", features = ["kv"] }
regex = "1.12.2"

[dev-dependencies]
httpmock = {version = "0.7.0-rc.1", features = ["remote"]}
tokio-test = "0.4.3"